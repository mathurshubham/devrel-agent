services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [ postgres_data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ 'CMD', 'pg_isready', '-U', '${POSTGRES_USER:-sentinel}' ]
      interval: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    # Security: use --requirepass. For production, prefer Docker secrets over env vars.
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --save 60 1000
    volumes: [ redis_data:/data ]

  backend:
    build: ./backend
    # Alembic runs migrations + seed before Uvicorn starts — idempotent on every restart.
    # --proxy-headers and --forwarded-allow-ips required for Cloudflare tunnel / ngrok / nginx.
    ports:
      - "8000:8000"
    command: >
      sh -c 'cd backend && alembic upgrade head && cd .. &&
             python -m backend.seed &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000
               --proxy-headers --forwarded-allow-ips="*"'
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker_scraper:
    build: ./backend
    command: celery -A backend.celery_app worker -Q scraper --concurrency=4 --loglevel=info
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      backend: { condition: service_started }

  worker_langgen:
    build: ./backend
    command: celery -A backend.celery_app worker -Q langgen --concurrency=8 --loglevel=info
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      backend: { condition: service_started }

  worker_maintenance:
    build: ./backend
    command: celery -A backend.celery_app worker -Q maintenance --concurrency=1 --loglevel=info
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      backend: { condition: service_started }

  beat:
    build: ./backend
    command: celery -A backend.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      worker_maintenance: { condition: service_started }

  # Optional observability stack — controlled by ENABLE_METRICS env var.
  # To include: docker-compose --profile metrics up -d
  prometheus:
    image: prom/prometheus:latest
    profiles: [ metrics ]
    volumes: [ ./prometheus.yml:/etc/prometheus/prometheus.yml ]
    ports: [ '9090:9090' ]

  grafana:
    image: grafana/grafana:latest
    profiles: [ metrics ]
    ports: [ '3001:3000' ]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_API_URL: http://backend:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    ports: [ '3000:3000' ]
    depends_on: [ backend ]

volumes:
  postgres_data:
  redis_data:
